name: Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The publish workflow calls this workflow before it builds the image.
  workflow_call:

jobs:
  quality:
    name: Run Quality Checks
    runs-on: ubuntu-latest
    # setup-bun cannot install the Bun canary in package.json, and only the canary has `bun lint`.
    # The Dockerfile pins the same image.
    container: oven/bun:canary@sha256:f6f46d24250e279c40e6946b81c78a3afa8b7d5910514a5d760b742203c36238

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check
